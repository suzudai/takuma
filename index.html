<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MelonPicks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800;900&family=Noto+Sans+JP:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@300;400;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    }

    .font-serif-jp {
      font-family: 'M PLUS Rounded 1c', 'Noto Serif JP', serif;
      /* Use rounded for serif too for friendliness */
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Illustration/Texture Patterns */
    .bg-grid-pattern {
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .bg-dot-pattern {
      background-image: radial-gradient(#10b981 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      background-color: #fffbeb;
      /* amber-50 */
    }

    .shadow-hard {
      box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
    }

    .shadow-hard-sm {
      box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
    }

    .text-shadow-title {
      text-shadow: 2px 2px 0px #000;
    }
  </style>

  }
}
</script>

</head>

<body class="bg-amber-50 text-neutral-900 antialiased selection:bg-emerald-200 selection:text-emerald-900">

</body>

</html>
